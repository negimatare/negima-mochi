# Fails when docs/skill-map.svg and .html no longer match the plugins, or a
# link between skills has no note. Fix it with: node scripts/skill-map.mjs
name: Skill map
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Skill map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/skill-map.mjs --check
