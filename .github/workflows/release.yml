# Publishes the release of a pushed v* tag. The checks come first, as an
# immutable release keeps its tag.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main."; exit 1; }
      - name: Run the script tests
        run: node --test tests/*.test.mjs
      - name: Check the skill map
        run: node scripts/skill-map.mjs --check
      - name: Write the release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Negima Mochi ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
